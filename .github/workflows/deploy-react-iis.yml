name: Deploy React to IIS

on:
  pull_request:
    branches: [ "main" ]
    types: [ closed ]

jobs:
  build-and-deploy:
    if: github.event.pull_request.merged == true
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create env.production
        run: |
          echo "REACT_APP_GIENPHIM_BE_API_URL=${{ secrets.REACT_APP_GIENPHIM_BE_API_URL }}" > .env.production
          echo "REACT_APP_GIENPHIM_BE_URL=${{ secrets.REACT_APP_GIENPHIM_BE_URL }}" >> .env.production

      - name: Install deps
        run: npm ci

      - name: Build React
        run: |
          $env:CI="false"
          npm run build

      - name: Deploy to IIS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.IIS_SERVER }}
          username: ${{ secrets.IIS_USERNAME }}
          password: ${{ secrets.IIS_PASSWORD }}
          port: 22
          source: "build/*"
          target: ${{ secrets.IIS_SITE_PATH_FE }}
          strip_components: 1
          exclude: |
            web.config
