name: Deploy React to IIS

on:
  pull_request:
    branches: [ "main" ]
    types: [ closed ]

jobs:
  build-and-deploy:
    if: github.event.pull_request.merged == true
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create env.production
        run: |
          echo "REACT_APP_GIENPHIM_BE_API_URL=${{ secrets.REACT_APP_GIENPHIM_BE_API_URL }}" > .env.production
          echo "REACT_APP_GIENPHIM_BE_URL=${{ secrets.REACT_APP_GIENPHIM_BE_URL }}" >> .env.production

      - name: Install deps
        run: npm ci

      - name: Build React
        run: |
          $env:CI="false"
          npm run build
      - name: Deploy to IIS via SCP (keep web.config)
        shell: pwsh
        run: |
          # 1. Tạo thư mục tạm nếu chưa có
          ssh ${{ secrets.IIS_USERNAME }}@${{ secrets.IIS_SERVER }} `
            "powershell -Command `
            if (!(Test-Path 'C:\deploy_temp')) { New-Item -ItemType Directory -Path 'C:\deploy_temp' }"

          # 2. Upload build lên thư mục tạm
          scp -r build/* `
            ${{ secrets.IIS_USERNAME }}@${{ secrets.IIS_SERVER }}:/C:/deploy_temp

          # 3. Xóa file cũ TRỪ web.config
          ssh ${{ secrets.IIS_USERNAME }}@${{ secrets.IIS_SERVER }} `
            "powershell -Command `
            Get-ChildItem '${{ secrets.IIS_SITE_PATH_FE }}' -Recurse -Exclude 'web.config' | Remove-Item -Recurse -Force"

          # 4. Copy file mới vào IIS folder
          ssh ${{ secrets.IIS_USERNAME }}@${{ secrets.IIS_SERVER }} `
            "powershell -Command `
            Copy-Item 'C:\deploy_temp\*' '${{ secrets.IIS_SITE_PATH_FE }}' -Recurse -Force"

