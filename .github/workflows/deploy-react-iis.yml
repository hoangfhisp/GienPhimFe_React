name: Deploy React to IIS

on:
  pull_request:
    branches: [ "main" ]
    types: [ closed ]

jobs:
  build-and-deploy:
    if: github.event.pull_request.merged == true
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create env.production
        run: |
          echo "REACT_APP_GIENPHIM_BE_API_URL=${{ secrets.REACT_APP_GIENPHIM_BE_API_URL }}" > .env.production
          echo "REACT_APP_GIENPHIM_BE_URL=${{ secrets.REACT_APP_GIENPHIM_BE_URL }}" >> .env.production

      - name: Install deps
        run: npm ci

      - name: Build React
        run: |
          $env:CI="false"
          npm run build

      - name: Deploy to IIS via MSDeploy (keep web.config)
        shell: pwsh
        run: |
          $dest = "contentPath=${{ secrets.IIS_SITE_PATH_FE }},computerName=https://${{ secrets.IIS_SERVER }}:8172/msdeploy.axd,userName=${{ secrets.IIS_USERNAME }},password=${{ secrets.IIS_PASSWORD }},authType=Basic"

          & "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe" `
            -verb:sync `
            -source:contentPath=build `
            -dest:$dest `
            -skip:objectName=filePath,absolutePath=\\web.config$ `
            -allowUntrusted

